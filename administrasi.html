<script>
'use strict';
const DBKEY='ruangkepala-v1';
const today=new Date();const isoToday=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
const plus=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};

an penggunaan BOS',due:plus(5),done:false,owner:'Kepala Madrasah'},{id:'t3',title:'Tanda tangani surat undangan komite',due:plus(6),done:true,owner:'Kepala Madrasah'}]};
const schemas={agenda:{title:'Agenda & Rapat',singular:'Agenda',desc:'Kelola rapat dan kegiatan madrasah.',icon:'▦',fields:[['title','Nama kegiatan','text',true],['date','Tanggal','date',true],['time','Waktu','time',true],['place','Lokasi','text',true],['category','Kategori','select',true,['Rapat','Kegiatan','Supervisi','Lainnya']],['notes','Catatan','textarea',false]]},surat:{title:'Persuratan',singular:'Surat',desc:'Buku agenda surat masuk dan surat keluar.',icon:'✉',fields:[['number','Nomor surat','text',true],['subject','Perihal','text',true],['date','Tanggal','date',true],['type','Jenis surat','select',true,['Masuk','Keluar']],['status','Status','select',true,['Konsep','Diproses','Terkirim','Arsip']],['fromTo','Asal / tujuan','text',false],['notes','Catatan','textarea',false]]},gtk:{title:'Data GTK',singular:'GTK',desc:'Direktori guru dan tenaga kependidikan.',icon:'♙',fields:[['name','Nama lengkap','text',true],['nip','NIP / NIK','text',false],['role','Jabatan / bidang','text',true],['status','Status kepegawaian','select',true,['PNS','PPPK','Honorer']],['email','Email','email',false],['phone','Nomor telepon','tel',false]]},program:{title:'Program Kerja',singular:'Program',desc:'Rencana kerja dan pemantauan pelaksanaan program.',icon:'◎',fields:[['name','Nama program','text',true],['area','Bidang','text',true],['target','Target / indikator','text',false],['start','Tanggal mulai','date',false],['end','Target selesai','date',false],['progress','Realisasi (%)','number',true],['status','Status','select',true,['Direncanakan','Berjalan','Selesai','Ditunda']],['budget','Anggaran (Rp)','number',false],['notes','Catatan','textarea',false]]},supervisi:{title:'Supervisi',singular:'Jadwal supervisi',desc:'Jadwalkan supervisi akademik dan tindak lanjut.',icon:'⌕',fields:[['teacher','Nama guru','text',true],['subject','Mata pelajaran','text',true],['date','Tanggal supervisi','date',true],['type','Jenis supervisi','select',true,['Observasi kelas','Administrasi pembelajaran','Pra-observasi','Tindak lanjut']],['status','Status','select',true,['Terjadwal','Terlaksana','Tindak lanjut']],['result','Hasil / catatan','textarea',false],['followup','Tindak lanjut','textarea',false]]},sarpras:{title:'Sarana & Prasarana',singular:'Aset',desc:'Inventaris fasilitas dan kondisi sarana madrasah.',icon:'⌂',fields:[['name','Nama aset','text',true],['category','Kategori','select',true,['Ruang','Elektronik','Mebel','Kendaraan','Lainnya']],['quantity','Jumlah','number',true],['condition','Kondisi','select',true,['Baik','Perlu perbaikan','Rusak']],['location','Lokasi','text',false],['notes','Catatan','textarea',false]]},tasks:{title:'Prioritas',singular:'Tugas',desc:'Daftar tindak lanjut kepala madrasah.',icon:'✓',fields:[['title','Nama tugas','text',true],['due','Tenggat','date',true],['owner','Penanggung jawab','text',false],['done','Status','select',true,['Belum selesai','Selesai']]]}};
function loadDb(){try{const d=JSON.parse(localStorage.getItem(DBKEY));if(d&&typeof d==='object')return Object.fromEntries(Object.keys(seed).map(k=>[k,Array.isArray(d[k])?d[k]:seed[k]]))}catch(e){}return structuredClone(seed)}let db=loadDb(),active='dashboard',editId=null,formType=null;
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(db))}catch(e){toast('Penyimpanan browser penuh atau tidak tersedia. Ekspor cadangan data.');throw e}}
function toast(msg){const n=$('notice');n.textContent=msg;n.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.classList.remove('show'),2600)}
function dateText(s){if(!s)return '—';const d=new Date(s+'T00:00:00');return `${d.getDate()} ${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()]} ${d.getFullYear()}`}
function badge(text){const c=text==='Rapat'||text==='Konsep'||text==='Ditunda'?'gold':text==='Supervisi'||text==='PPPK'||text==='Terkirim'?'blue':text==='Rusak'||text==='Perlu perbaikan'?'gold':text==='Selesai'||text==='Baik'||text==='PNS'?'':'gray';return `<span class="badge ${c}">${esc(text||'—')}</span>`}
const pageTitles={dashboard:'Dashboard',agenda:'Agenda & Rapat',surat:'Persuratan',program:'Program Kerja',supervisi:'Supervisi',gtk:'Data GTK',sarpras:'Sarana & Prasarana',laporan:'Laporan & Cadangan'};
function head(title,desc,button=''){return `<div class="head"><div><div class="eyebrow">Administrasi Kepala Madrasah</div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function stat(label,value,icon,foot=''){return `<div class="card stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function dash(){const upcoming=[...db.agenda].filter(x=>x.date>=isoToday).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4),openLetters=db.surat.filter(x=>!['Terkirim','Arsip'].includes(x.status)).length,progress=db.program.length?Math.round(db.program.reduce((n,x)=>n+(Number(x.progress)||0),0)/db.program.length):0;return `${head('Dashboard','Ringkasan aktivitas dan administrasi madrasah.',`<button class="btn primary" onclick="openForm('agenda')">＋ Tambah agenda</button>`)}<div class="grid stats">${stat('Agenda mendatang',upcoming.length,'▦','Kegiatan terjadwal')}${stat('Surat perlu tindak lanjut',openLetters,'✉','Surat masuk & konsep')}${stat('Rata-rata program',progress+'%','◎','Realisasi kerja')}${stat('Guru & tenaga kependidikan',db.gtk.length,'♙','Direktori GTK')}</div><div class="grid content"><div class="card panel"><div class="panel-head"><div><h2>Agenda mendatang</h2><p>Jadwal kegiatan terdekat</p></div><button class="btn light" onclick="go('agenda')">Lihat semua</button></div><div class="agenda">${upcoming.length?upcoming.map(x=>`<div class="agenda-item"><div class="agenda-date"><b>${new Date(x.date+'T00:00:00').getDate()}</b><small>${new Date(x.date+'T00:00:00').toLocaleDateString('id-ID',{month:'short'})}</small></div><div><strong>${esc(x.title)}</strong><small>${esc(x.time||'')} · ${esc(x.place||'')}</small></div>${badge(x.category)}</div>`).join(''):'<div class="empty">Belum ada agenda mendatang.</div>'}</div></div><div class="card panel"><div class="panel-head"><div><h2>Prioritas minggu ini</h2><p>Daftar tindak lanjut</p></div><button class="btn light" onclick="openForm('tasks')">＋ Tugas</button></div><div class="todo">${db.tasks.slice(0,5).map(t=>`<label><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${esc(t.id)}',this.checked)"><span>${esc(t.title)}<small>Tenggat ${dateText(t.due)}</small></span></label>`).join('')||'<div class="empty">Belum ada tugas.</div>'}</div><div class="progress-wrap"><div class="progress-label"><span>Tugas selesai</span><b>${db.tasks.filter(x=>x.done).length} / ${db.tasks.length}</b></div><div class="progress"><span style="width:${db.tasks.length?db.tasks.filter(x=>x.done).length/db.tasks.length*100:0}%"></span></div></div></div></div><div class="grid stats" style="margin-top:14px">${stat('GTK',db.gtk.length,'♙','Data terdaftar')}${stat('Surat tercatat',db.surat.length,'✉','Masuk dan keluar')}${stat('Supervisi',db.supervisi.length,'⌕','Jadwal & catatan')}${stat('Inventaris',db.sarpras.reduce((n,x)=>n+(+x.quantity||0),0),'⌂','Unit aset terdata')}</div>`}
const cols={agenda:[['date','Tanggal'],['time','Waktu'],['title','Nama kegiatan'],['place','Lokasi'],['category','Kategori']],surat:[['date','Tanggal'],['number','Nomor surat'],['subject','Perihal'],['type','Jenis'],['fromTo','Asal / tujuan'],['status','Status']],gtk:[['name','Nama'],['nip','NIP/NIK'],['role','Jabatan / bidang'],['status','Status'],['email','Email'],['phone','Telepon']],program:[['name','Program'],['area','Bidang'],['target','Target'],['progress','Realisasi'],['status','Status'],['end','Target selesai']],supervisi:[['teacher','Nama guru'],['subject','Mata pelajaran'],['date','Tanggal'],['type','Jenis'],['status','Status'],['result','Hasil']],sarpras:[['name','Nama aset'],['category','Kategori'],['quantity','Jumlah'],['condition','Kondisi'],['location','Lokasi'],['notes','Catatan']],tasks:[['title','Tugas'],['due','Tenggat'],['owner','Penanggung jawab'],['done','Status']]};
function displayValue(type,key,val){if(key==='date'||key==='due'||key==='end')return dateText(val);if(key==='progress')return `${esc(val||0)}%`;if(key==='budget')return Number(val||0).toLocaleString('id-ID');if(key==='done')return badge(val?'Selesai':'Belum selesai');if(['status','category','type','condition'].includes(key))return badge(val);return esc(val||'—')}
function tablePage(type){const s=schemas[type],q=($('search')?.value||'').trim().toLocaleLowerCase('id');const rows=db[type].filter(r=>!q||Object.values(r).some(v=>String(v??'').toLocaleLowerCase('id').includes(q)));return `${head(s.title,s.desc,`<button class="btn primary" onclick="openForm('${type}')">＋ Tambah ${s.singular}</button>`)}<div class="card panel"><div class="toolbar"><div><b>${s.title}</b><small>Menampilkan ${rows.length} dari ${db[type].length} data · klik ubah untuk memperbarui</small></div><div class="controls"><div class="search"><input id="search" type="search" placeholder="Cari data..." value="${esc(q)}" oninput="refreshTable('${type}')"></div><button class="btn light" onclick="exportCsv('${type}')">⇩ CSV</button></div></div><div class="table-wrap"><table class="table"><thead><tr>${cols[type].map(c=>`<th>${c[1]}</th>`).join('')}<th>Aksi</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols[type].map(c=>`<td>${displayValue(type,c[0],r[c[0]])}</td>`).join('')}<td><div class="actions"><button class="smallbtn" onclick="editForm('${type}','${esc(r.id)}')">Ubah</button><button class="smallbtn del" onclick="removeRecord('${type}','${esc(r.id)}')">Hapus</button></div></td></tr>`).join(''):`<tr><td colspan="${cols[type].length+1}"><div class="empty">Belum ada data. Tambahkan data pertama Anda.</div></td></tr>`}</tbody></table></div></div>`}
function refreshTable(type){const input=$('search'),v=input.value,sel=input.selectionStart;render(type);const next=$('search');next.focus();next.setSelectionRange(sel,sel)}
function reports(){const counts=Object.entries(schemas).map(([k,s])=>[s.title,db[k].length,k]);return `${head('Laporan & Cadangan','Ringkasan data administrasi, cetak laporan, dan kelola cadangan.') }<div class="section-note">Data tersimpan hanya di browser/perangkat ini. Buat dan simpan cadangan JSON secara berkala.</div><div class="grid stats">${stat('Agenda',db.agenda.length,'▦','Kegiatan dan rapat')}${stat('Surat',db.surat.length,'✉','Masuk dan keluar')}${stat('GTK',db.gtk.length,'♙','Direktori pegawai')}${stat('Program kerja',db.program.length,'◎','Program terdata')}</div><div class="grid reports-grid"><div class="card panel"><div class="panel-head"><div><h2>Ringkasan administrasi</h2><p>Jumlah data saat ini</p></div><button class="btn primary" onclick="window.print()">Cetak</button></div>${counts.map(x=>`<div class="report-row"><span>${x[0]}</span><b>${x[1]} <button class="smallbtn" onclick="go('${x[2]}')">Buka</button></b></div>`).join('')}<div class="report-row"><span>Jumlah unit inventaris</span><b>${db.sarpras.reduce((n,x)=>n+(Number(x.quantity)||0),0)}</b></div><div class="report-row"><span>Tugas selesai</span><b>${db.tasks.filter(x=>x.done).length} / ${db.tasks.length}</b></div></div><div class="card panel"><div class="panel-head"><div><h2>Cadangan & pemulihan data</h2><p>Ekspor dan impor seluruh administrasi</p></div><span class="stat-icon">⇅</span></div><p class="muted">Cadangan berisi GTK, agenda, surat, program kerja, supervisi, inventaris, dan tugas.</p><div style="display:flex;flex-wrap:wrap;gap:8px;margin:15px 0"><button class="btn primary" onclick="backup()">⇩ Unduh cadangan JSON</button><button class="btn light" onclick="$('importFile').click()">⇧ Pulihkan cadangan</button></div><div class="section-note">Pemulihan akan mengganti seluruh data lokal saat ini. Pastikan Anda mengimpor file cadangan yang tepercaya.</div><button class="btn light" onclick="exportCsv('gtk')">Ekspor GTK CSV</button> <button class="btn light" onclick="exportCsv('agenda')">Ekspor agenda CSV</button></div></div>`}
function render(pageName='dashboard'){active=pageName;$('crumb').textContent=pageTitles[pageName]||schemas[pageName]?.title||'Dashboard';document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===pageName));if(pageName==='dashboard')$('page').innerHTML=dash();else if(pageName==='laporan')$('page').innerHTML=reports();else $('page').innerHTML=tablePage(pageName);$('sidebar').classList.remove('open')}
function go(pageName){render(pageName);window.scrollTo({top:0,behavior:'smooth'})}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});$('menuToggle').addEventListener('click',()=>$('sidebar').classList.toggle('open'));$('today').textContent=today.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});$('notif').addEventListener('click',()=>toast(`${db.surat.filter(x=>!['Terkirim','Arsip'].includes(x.status)).length} surat perlu tindak lanjut.`));
function toggleTask(id,done){const t=db.tasks.find(x=>x.id===id);if(t){t.done=done;save();render('dashboard')}}
function openForm(type,record=null){formType=type;editId=record?.id||null;const s=schemas[type];$('modalTitle').textContent=`${record?'Ubah':'Tambah'} ${s.singular}`;$('modalDesc').textContent=s.desc;$('fields').innerHTML=s.fields.map(([key,label,kind,required,options])=>{let value=record?.[key]??(kind==='date'?isoToday:kind==='number'&&key==='progress'?0:'');if(key==='done')value=value?'Selesai':'Belum selesai';const cls=kind==='textarea'||['title','subject','name','target','result','followup','notes'].includes(key)?'field full':'field';const control=kind==='select'?`<select name="${key}" ${required?'required':''}>${options.map(o=>`<option value="${esc(o==='Selesai'&&key==='done'?'true':o==='Belum selesai'&&key==='done'?'false':o)}" ${String(value)===String(o)||key==='done'&&String(value)===(o==='Selesai'?'true':'false')?'selected':''}>${esc(o)}</option>`).join('')}</select>`:kind==='textarea'?`<textarea name="${key}" maxlength="1000">${esc(value)}</textarea>`:`<input name="${key}" type="${kind}" value="${esc(value)}" ${required?'required':''} ${kind==='number'&&key==='progress'?'min="0" max="100"':''} ${kind==='number'&&key==='quantity'?'min="0"':''} ${kind==='number'&&key==='budget'?'min="0"':''} maxlength="${['text','email','tel'].includes(kind)?150:undefined}">`;return `<div class="${cls}"><label>${label}${required?' *':''}</label>${control}</div>`}).join('');$('modalBg').classList.add('show');$('fields').querySelector('input,select,textarea')?.focus()}
function editForm(type,id){const r=db[type].find(x=>x.id===id);if(r)openForm(type,r)}function closeModal(){$('modalBg').classList.remove('show')}$('cancel').addEventListener('click',closeModal);$('modalBg').addEventListener('click',e=>{if(e.target===$('modalBg'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('dataForm').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));if(formType==='tasks')data.done=data.done==='true';if(formType==='program'){data.progress=Math.min(100,Math.max(0,Number(data.progress)||0));data.budget=Number(data.budget)||0}if(formType==='sarpras')data.quantity=Math.max(0,Number(data.quantity)||0);if(editId)db[formType]=db[formType].map(x=>x.id===editId?{...x,...data}:x);else db[formType].push({id:crypto.randomUUID?.()||String(Date.now()),...data});try{save()}catch{return}closeModal();render(active);toast(`${schemas[formType].singular} berhasil ${editId?'diperbarui':'ditambahkan'}.`)});
function removeRecord(type,id){const r=db[type].find(x=>x.id===id);if(!r||!confirm(`Hapus data ${r.name||r.title||r.subject||r.number||r.teacher||r.id}?`))return;db[type]=db[type].filter(x=>x.id!==id);try{save()}catch{return}render(active);toast('Data berhasil dihapus.')}
function csvCell(value){let text=String(value??'');if(/^[=+\-@\t\r]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'}function exportCsv(type){const fields=schemas[type].fields.map(f=>f[0]),labels=schemas[type].fields.map(f=>f[1]);const csv=[labels,...db[type].map(r=>fields.map(k=>k==='done'?(r[k]?'Selesai':'Belum selesai'):r[k]))].map(row=>row.map(csvCell).join(',')).join('\r\n');download(`ruangkepala-${type}.csv`,'\uFEFF'+csv,'text/csv;charset=utf-8');toast('File CSV berhasil dibuat.')}
function download(name,data,mime){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download(`cadangan-ruangkepala-${isoToday}.json`,JSON.stringify({app:'RuangKepala',version:1,exportedAt:new Date().toISOString(),data:db},null,2),'application/json');toast('Cadangan JSON berhasil diunduh.')}
$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text()),data=parsed.data||parsed;if(!Object.keys(seed).every(k=>Array.isArray(data[k])))throw new Error('Struktur cadangan tidak sesuai.');if(!confirm('Pemulihan akan mengganti semua data lokal. Lanjutkan?'))return;db=Object.fromEntries(Object.keys(seed).map(k=>[k,data[k]]));save();render(active);toast('Cadangan berhasil dipulihkan.')}catch(err){toast(err.message==='Struktur cadangan tidak sesuai.'?err.message:'File cadangan tidak valid atau tidak dapat dibaca.')}finally{e.target.value=''}});
render();
</script></body></html>
