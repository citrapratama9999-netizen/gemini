or:var(--muted)}.crumb b{color:var(--ink);font-weight:650}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;color:#536159;position:relative}.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#e27557;right:8px;top:7px;border:1px solid white}.date-pill{color:#69766e;font-size:12px;padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:10px}.mobile-menu{display:none}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:23px}.eyebrow{font-size:11px;color:var(--green);font-weight:750;letter-spacing:1px;text-transform:uppercase}.page-head h1{font-size:27px;line-height:1.2;letter-spacing:-.8px;margin:5px 0 6px}.page-head p{margin:0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:650;display:inline-flex;align-items:center;gap:8px;transition:.15s}.btn-primary{background:var(--green);color:white}.btn-primary:hover{background:var(--green-dark);transform:translateY(-1px)}.btn-light{background:#fff;border:1px solid var(--line);color:#516057}.btn-sm{padding:7px 10px;font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:17px 18px;position:relative;overflow:hidden}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;background:var(--mint);color:var(--green);border-radius:10px;display:grid;place-items:center;font-size:16px}.stat-value{font-size:27px;font-weight:750;letter-spacing:-1px;margin:12px 0 1px}.stat-foot{font-size:11px;color:var(--muted)}.stat-foot em{font-style:normal;color:var(--green);font-weight:700}.content-grid{grid-template-columns:minmax(0,1.55fr) minmax(270px,.9fr);align-items:start}.panel{padding:19px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-head h2{margin:0;font-size:15px;letter-spacing:-.2px}.panel-head p{font-size:11px;color:var(--muted);margin:3px 0 0}.text-link{color:var(--green);font-size:12px;font-weight:700;text-decoration:none;border:0;background:none}.agenda-list{display:grid}.agenda-item{display:grid;grid-template-columns:51px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #f0f2f0}.agenda-item:first-child{border-top:0}.agenda-date{width:47px;height:48px;border-radius:10px;background:#f5f8f5;display:grid;align-content:center;justify-items:center}.agenda-date strong{font-size:17px;line-height:1.1}.agenda-date small{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:700}.agenda-info strong{font-size:12px;display:block}.agenda-info small{color:var(--muted);font-size:11px}.tag{border-radius:20px;background:#edf5ee;color:#4b7958;padding:4px 8px;font-size:10px;font-weight:700;white-space:nowrap}.tag.gold{background:#fbf2df;color:#96702b}.tag.blue{background:#eaf1f8;color:#557493}.tag.gray{background:#f0f2f1;color:#68746d}.todo-list{display:grid;gap:13px}.todo{display:flex;gap:10px;align-items:flex-start;font-size:12px}.todo-check{accent-color:var(--green);width:15px;height:15px;margin-top:1px}.todo strong{display:block;font-weight:650}.todo small{font-size:10px;color:var(--muted)}.progress-wrap{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px}.progress{height:6px;border-radius:5px;background:#edf0ed;overflow:hidden}.progress span{height:100%;display:block;background:var(--green);border-radius:5px}.bottom-grid{grid-template-columns:1.15fr .85fr;margin-top:16px}.program-card{padding:17px;display:flex;gap:14px;align-items:center}.program-icon{width:42px;height:42px;border-radius:12px;background:#fbf2df;display:grid;place-items:center;font-size:19px}.program-card strong{font-size:12px}.program-card small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.program-card .progress{margin-top:9px;width:160px}.program-percent{font-weight:750;color:var(--green);margin-left:auto;font-size:13px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:570px}.table th{text-align:left;color:#89948d;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:11px 12px;border-bottom:1px solid var(--line)}.table td{padding:12px;border-bottom:1px solid #f0f2f0;font-size:12px}.table tr:last-child td{border-bottom:0}.table td strong{font-size:12px}.table .muted{color:var(--muted);font-size:11px}.search{position:relative}.search input{padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;width:230px;font-size:12px}.search input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:#8eb9a0;box-shadow:0 0 0 3px #e8f3ec}.search span{position:absolute;left:11px;top:8px;color:#95a098}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.filters{display:flex;gap:8px}.select{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 11px;color:#58665d;font-size:12px}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin:8px}.modal-backdrop{position:fixed;inset:0;background:rgba(22,35,28,.38);display:none;place-items:center;padding:18px;z-index:20}.modal-backdrop.show{display:grid}.modal{width:min(490px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 25px 70px #11251b33}.modal h2{margin:0 0 5px;font-size:18px}.modal>p{margin:0 0 18px;color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#58665d}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;outline:none;font-size:12px;background:#fff}.field textarea{resize:vertical;min-height:72px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{position:fixed;right:22px;bottom:22px;background:#193e2c;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:30;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;font-size:12px}.notice.show{opacity:1;transform:translateY(0)}.section-note{background:#edf5ee;border:1px solid #dfece2;color:#42634d;padding:13px 15px;border-radius:10px;font-size:12px;margin-bottom:15px}.status{border-radius:20px;padding:4px 8px;font-size:10px;font-weight:700;background:#edf5ee;color:#4b7958}.status.pending{background:#fbf2df;color:#96702b}.status.done{background:#eaf1f8;color:#557493}.action-cell{display:flex;gap:5px}.delete-btn{border:0;background:#fff0ee;color:#b45445;border-radius:7px;padding:5px 8px;font-size:11px}.footer-note{margin-top:22px;color:#9aa39d;font-size:10px;text-align:center}
    @media(max-width:1050px){.main{padding:24px}.sidebar{width:220px}.main{margin-left:220px}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s;width:250px;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.main{margin:0;padding:17px 15px 40px}.mobile-menu{display:inline-grid}.date-pill{display:none}.topbar{margin-bottom:21px}.page-head{align-items:flex-start}.page-head h1{font-size:23px}.stats{gap:10px}.stat{padding:14px}.stat-value{font-size:24px}.content-grid,.bottom-grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.search,.search input{width:100%}.filters{width:100%}.filters .select{flex:1}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-head .btn{padding:9px;font-size:11px}.program-card .progress{width:120px}}
    @media(max-width:390px){.stats{grid-template-columns:1fr 1fr}.stat-top{font-size:10px}.stat-icon{width:29px;height:29px}.agenda-item{grid-template-columns:44px 1fr auto;gap:8px}.agenda-date{width:42px}.tag{font-size:9px;padding:4px 6px}}
  </style>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">م</div><div><div class="brand-name">RuangKepala</div><div class="brand-sub">Administrasi Madrasah</div></div></div>
    <div class="nav-label">MENU UTAMA</div>
    <nav class="nav" id="nav">
      <button class="active" data-page="dashboard"><span class="nav-icon">◫</span>Dashboard</button>
      <button data-page="agenda"><span class="nav-icon">▦</span>Agenda & Rapat</button>
      <button data-page="surat"><span class="nav-icon">✉</span>Persuratan</button>
      <button data-page="program"><span class="nav-icon">◎</span>Program Kerja</button>
      <button data-page="supervisi"><span class="nav-icon">⌕</span>Supervisi</button>
      <button data-page="gtk"><span class="nav-icon">♙</span>Data GTK</button>
      <button data-page="sarpras"><span class="nav-icon">⌂</span>Sarana & Prasarana</button>
      <div class="nav-label">LAINNYA</div>
      <button data-page="laporan"><span class="nav-icon">▤</span>Laporan</button>
    </nav>
    <div class="sidebar-bottom"><div class="school-card"><strong>MTs Harapan Bangsa</strong><span>Tahun Pelajaran 2025/2026</span></div><div class="profile"><div class="avatar">AK</div><div><strong>Ahmad Kurniawan, M.Pd.</strong><small>Kepala Madrasah</small></div></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="icon-btn mobile-menu" id="menuToggle" aria-label="Buka menu">☰</button><div class="crumb">MTs Harapan Bangsa <span style="color:#c2cac4"> / </span> <b id="crumb">Dashboard</b></div></div><div class="top-actions"><div class="date-pill" id="today"></div><button class="icon-btn" id="notification" aria-label="Notifikasi">♧<span class="dot"></span></button></div></header>
    <section id="page"></section>
    <div class="footer-note">RuangKepala · Administrasi terkelola, madrasah lebih berdaya.</div>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Tambah agenda</h2><p id="modalDescription">Catat kegiatan dan jadwal madrasah.</p><form id="itemForm"><div class="form-grid" id="formFields"></div><div class="modal-actions"><button type="button" class="btn btn-light" id="cancelModal">Batal</button><button class="btn btn-primary" type="submit">Simpan</button></div></form></div></div>
<div class="notice" id="notice"></div>
<script>
  const monthNames=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const dayNames=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  const today=new Date();document.getElementById('today').textContent=`${today.getDate()} ${monthNames[today.getMonth()]} ${today.getFullYear()}`;
  const seedAgenda=[
    {id:1,title:'Rapat koordinasi awal pekan',date:today.toISOString().slice(0,10),time:'08:00',place:'Ruang Kepala Madrasah',category:'Rapat'},
    {id:2,title:'Supervisi pembelajaran — Kelas VIII',date:future(1),time:'10:00',place:'Ruang Kelas VIII-A',category:'Supervisi'},
    {id:3,title:'Pemeriksaan kelengkapan administrasi guru',date:future(2),time:'09:00',place:'Ruang Guru',category:'Kegiatan'},
    {id:4,title:'Rapat komite dan wali murid',date:future(5),time:'13:00',place:'Aula Madrasah',category:'Rapat'}
  ];
  function future(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
  const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}};
  let agenda=read('rk-agenda',seedAgenda), letters=read('rk-letters',[
    {id:1,number:'001/MTs-HB/XI/2025',subject:'Undangan rapat koordinasi',date:future(-2),type:'Keluar',status:'Terkirim'},
    {id:2,number:'014/KK.13/MTs/2025',subject:'Permohonan data EMIS',date:future(-1),type:'Masuk',status:'Diproses'},
    {id:3,number:'002/MTs-HB/XI/2025',subject:'Surat tugas kegiatan KKG',date:future(0),type:'Keluar',status:'Konsep'}
  ]);
  const staff=[['Siti Rahayu, S.Pd.','Guru Bahasa Indonesia','PNS'],['Muhammad Fikri, S.Pd.I.','Guru Fikih','PPPK'],['Dewi Anggraini, S.Pd.','Waka Kurikulum','PNS'],['Agus Salim, S.Pd.','Guru Matematika','Honorer'],['Nur Aisyah, S.Pd.I.','Guru Akidah Akhlak','PPPK']];
  const pageInfo={dashboard:['Dashboard','Ringkasan aktivitas dan administrasi madrasah Anda.'],agenda:['Agenda & Rapat','Kelola jadwal kegiatan, rapat, dan agenda kepala madrasah.'],surat:['Persuratan','Pencatatan surat masuk dan surat keluar madrasah.'],program:['Program Kerja','Pantau pelaksanaan program kerja tahunan madrasah.'],supervisi:['Supervisi','Rencanakan dan dokumentasikan kegiatan supervisi akademik.'],gtk:['Data GTK','Direktori guru dan tenaga kependidikan madrasah.'],sarpras:['Sarana & Prasarana','Pantau inventaris dan pemeliharaan fasilitas madrasah.'],laporan:['Laporan','Ringkasan administrasi untuk evaluasi dan tindak lanjut.']};
  const page=document.getElementById('page');let activePage='dashboard';
  function dateParts(value){const d=new Date(value+'T00:00:00');return {day:d.getDate(),month:monthNames[d.getMonth()].slice(0,3),full:`${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`}}
  function header(key,action=''){const [title,desc]=pageInfo[key];return `<div class="page-head"><div><div class="eyebrow">Ruang Kerja Kepala Madrasah</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
  function dashboard(){const upcoming=[...agenda].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);return `${header('dashboard',`<button class="btn btn-primary" onclick="openForm('agenda')">＋ <span>Tambah agenda</span></button>`)}
    <div class="grid stats"><div class="card stat"><div class="stat-top"><span>Agenda bulan ini</span><span class="stat-icon">▦</span></div><div class="stat-value">${agenda.length.toString().padStart(2,'0')}</div><div class="stat-foot"><em>● Terjadwal</em> untuk ditindaklanjuti</div></div><div class="card stat"><div class="stat-top"><span>Surat perlu tindak lanjut</span><span class="stat-icon">✉</span></div><div class="stat-value">${letters.filter(x=>x.status!=='Terkirim').length.toString().padStart(2,'0')}</div><div class="stat-foot">Surat masuk & konsep surat</div></div><div class="card stat"><div class="stat-top"><span>Program terlaksana</span><span class="stat-icon">◎</span></div><div class="stat-value">68<span style="font-size:16px">%</span></div><div class="stat-foot"><em>↑ 12%</em> dari bulan sebelumnya</div></div><div class="card stat"><div class="stat-top"><span>Guru & tenaga kependidikan</span><span class="stat-icon">♙</span></div><div class="stat-value">${staff.length+24}</div><div class="stat-foot">Data GTK aktif</div></div></div>
    <div class="grid content-grid"><div class="card panel"><div class="panel-head"><div><h2>Agenda mendatang</h2><p>Jadwal kegiatan madrasah terdekat</p></div><button class="text-link" onclick="navigate('agenda')">Lihat semua →</button></div><div class="agenda-list">${upcoming.length?upcoming.map(item=>{const d=dateParts(item.date);return `<div class="agenda-item"><div class="agenda-date"><strong>${d.day}</strong><small>${d.month}</small></div><div class="agenda-info"><strong>${escapeHtml(item.title)}</strong><small>${item.time} · ${escapeHtml(item.place)}</small></div><span class="tag ${item.category==='Rapat'?'gold':item.category==='Supervisi'?'blue':''}">${escapeHtml(item.category)}</span></div>`}).join(''):'<div class="empty">Belum ada agenda.</div>'}</div></div>
    <div class="card panel"><div class="panel-head"><div><h2>Prioritas minggu ini</h2><p>Checklist tugas kepala madrasah</p></div><span class="tag">3 tugas</span></div><div class="todo-list"><label class="todo"><input class="todo-check" type="checkbox"><span><strong>Validasi jadwal supervisi guru</strong><small>Target: Jumat, 14 November</small></span></label><label class="todo"><input class="todo-check" type="checkbox"><span><strong>Tinjau laporan penggunaan BOS</strong><small>Target: Senin, 17 November</small></span></label><label class="todo"><input class="todo-check" type="checkbox"><span><strong>Tanda tangani surat undangan komite</strong><small>Target: Selasa, 18 November</small></span></label></div><div class="progress-wrap"><div class="progress-label"><span>Progres penyelesaian</span><strong id="taskProgress">0 / 3</strong></div><div class="progress"><span id="taskBar" style="width:0%"></span></div></div></div></div>
    <div class="grid bottom-grid"><div class="card panel"><div class="panel-head"><div><h2>Program kerja unggulan</h2><p>Realisasi program tahun pelajaran 2025/2026</p></div><button class="text-link" onclick="navigate('program')">Detail →</button></div><div class="program-card"><div class="program-icon">📚</div><div style="flex:1"><strong>Peningkatan mutu pembelajaran</strong><small>8 dari 12 kegiatan terlaksana</small><div class="progress"><span style="width:68%"></span></div></div><span class="program-percent">68%</span></div></div><div class="card panel"><div class="panel-head"><div><h2>Ringkasan persuratan</h2><p>Status surat terbaru</p></div><button class="text-link" onclick="navigate('surat')">Buka →</button></div><div style="display:flex;gap:10px;align-items:center;padding:10px 0"><span class="stat-icon">✉</span><div><strong style="font-size:12px">${letters.length} surat tercatat</strong><div style="font-size:11px;color:var(--muted)">${letters.filter(x=>x.status==='Diproses'||x.status==='Konsep').length} menunggu tindak lanjut</div></div></div></div></div>`}
  function agendaPage(){const sorted=[...agenda].sort((a,b)=>a.date.localeCompare(b.date));return `${header('agenda',`<button class="btn btn-primary" onclick="openForm('agenda')">＋ Tambah agenda</button>`)}<div class="card panel"><div class="toolbar"><div><strong style="font-size:13px">Semua agenda</strong><div style="font-size:11px;color:var(--muted);margin-top:3px">${agenda.length} kegiatan tercatat</div></div><div class="search"><span>⌕</span><input id="tableSearch" placeholder="Cari agenda..." oninput="filterRows(this.value)"></div></div><div class="table-wrap"><table class="table" id="dataTable"><thead><tr><th>Tanggal & waktu</th><th>Agenda kegiatan</th><th>Lokasi</th><th>Kategori</th><th>Aksi</th></tr></thead><tbody>${sorted.map(x=>{const d=dateParts(x.date);return `<tr data-search="${escapeHtml((x.title+' '+x.place+' '+x.category).toLowerCase())}"><td><strong>${d.day} ${d.month}</strong><div class="muted">${x.time}</div></td><td><strong>${escapeHtml(x.title)}</strong><div class="muted">Tahun pelajaran 2025/2026</div></td><td>${escapeHtml(x.place)}</td><td><span class="tag ${x.category==='Rapat'?'gold':x.category==='Supervisi'?'blue':''}">${escapeHtml(x.category)}</span></td><td><button class="delete-btn" onclick="removeItem('agenda',${x.id})">Hapus</button></td></tr>`}).join('')||emptyRow(5,'Belum ada agenda. Tambahkan kegiatan pertama Anda.')}</tbody></table></div></div>`}
  function lettersPage(){return `${header('surat',`<button class="btn btn-primary" onclick="openForm('surat')">＋ Catat surat</button>`)}<div class="section-note">Pastikan setiap surat masuk dicatat dan diteruskan kepada penanggung jawab terkait.</div><div class="card panel"><div class="toolbar"><div><strong style="font-size:13px">Buku agenda surat</strong><div style="font-size:11px;color:var(--muted);margin-top:3px">${letters.length} surat masuk dan keluar</div></div><div class="search"><span>⌕</span><input id="tableSearch" placeholder="Cari nomor atau perihal..." oninput="filterRows(this.value)"></div></div><div class="table-wrap"><table class="table" id="dataTable"><thead><tr><th>Tanggal</th><th>Nomor surat</th><th>Perihal</th><th>Jenis</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${[...letters].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr data-search="${escapeHtml((x.number+' '+x.subject+' '+x.type+' '+x.status).toLowerCase())}"><td>${dateParts(x.date).full}</td><td><strong>${escapeHtml(x.number)}</strong></td><td>${escapeHtml(x.subject)}</td><td><span class="tag ${x.type==='Masuk'?'blue':''}">${x.type}</span></td><td><span class="status ${x.status==='Diproses'?'pending':x.status==='Konsep'?'done':''}">${x.status}</span></td><td><button class="delete-btn" onclick="removeItem('surat',${x.id})">Hapus</button></td></tr>`).join('')||emptyRow(6,'Belum ada surat tercatat.')}</tbody></table></div></div>`}
  const programs=[['Peningkatan mutu pembelajaran','Kurikulum',68,'Berjalan'],['Penguatan karakter dan budaya madrasah','Kesiswaan',82,'Berjalan'],['Pengembangan kompetensi GTK','Kepegawaian',45,'Berjalan'],['Pemeliharaan sarana pembelajaran','Sarpras',100,'Selesai'],['Penguatan kemitraan orang tua','Humas',30,'Berjalan']];
  function programPage(){return `${header('program',`<button class="btn btn-light" onclick="notify('Data program kerja siap dicetak.')">⇩ Ekspor laporan</button>`)}<div class="section-note">Tahun Pelajaran 2025/2026 · Program kerja kepala madrasah berdasarkan rencana kerja tahunan.</div><div class="grid stats"><div class="card stat"><div class="stat-top">Total program<span class="stat-icon">◎</span></div><div class="stat-value">12</div><div class="stat-foot">Program kerja tahunan</div></div><div class="card stat"><div class="stat-top">Sedang berjalan<span class="stat-icon">↗</span></div><div class="stat-value">8</div><div class="stat-foot">Program dalam pelaksanaan</div></div><div class="card stat"><div class="stat-top">Selesai<span class="stat-icon">✓</span></div><div class="stat-value">3</div><div class="stat-foot">Program tuntas</div></div><div class="card stat"><div class="stat-top">Rata-rata realisasi<span class="stat-icon">◷</span></div><div class="stat-value">68<span style="font-size:16px">%</span></div><div class="stat-foot">Semester ganjil</div></div></div><div class="card panel"><div class="panel-head"><div><h2>Rencana kerja prioritas</h2><p>Capaian program lintas bidang</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Program kerja</th><th>Penanggung jawab</th><th>Realisasi</th><th>Status</th></tr></thead><tbody>${programs.map(p=>`<tr><td><strong>${p[0]}</strong></td><td>${p[1]}</td><td style="min-width:145px"><div style="display:flex;gap:8px;align-items:center"><div class="progress" style="flex:1"><span style="width:${p[2]}%"></span></div><small>${p[2]}%</small></div></td><td><span class="status ${p[3]==='Selesai'?'done':''}">${p[3]}</span></td></tr>`).join('')}</tbody></table></div></div>`}
  const supervision=[['Siti Rahayu, S.Pd.','Bahasa Indonesia','12 Nov 2025','Instrumen observasi'],['Muhammad Fikri, S.Pd.I.','Fikih','18 Nov 2025','Pra-observasi'],['Agus Salim, S.Pd.','Matematika','24 Nov 2025','Terjadwal']];
  function supervisionPage(){return `${header('supervisi',`<button class="btn btn-primary" onclick="notify('Form supervisi akan segera tersedia.')">＋ Jadwalkan supervisi</button>`)}<div class="grid stats"><div class="card stat"><div class="stat-top">Jadwal semester ini<span class="stat-icon">▦</span></div><div class="stat-value">18</div><div class="stat-foot">Tahun pelajaran 2025/2026</div></div><div class="card stat"><div class="stat-top">Terlaksana<span class="stat-icon">✓</span></div><div class="stat-value">11</div><div class="stat-foot">Supervisi akademik</div></div><div class="card stat"><div class="stat-top">Terjadwal<span class="stat-icon">◷</span></div><div class="stat-value">7</div><div class="stat-foot">Menunggu pelaksanaan</div></div><div class="card stat"><div class="stat-top">Tindak lanjut<span class="stat-icon">↗</span></div><div class="stat-value">4</div><div class="stat-foot">Perlu pemantauan</div></div></div><div class="card panel"><div class="panel-head"><div><h2>Jadwal supervisi akademik</h2><p>Semester ganjil · 2025/2026</p></div><button class="btn btn-light btn-sm" onclick="notify('Format instrumen supervisi siap diunduh.')">⇩ Instrumen</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Guru</th><th>Mata pelajaran</th><th>Jadwal</th><th>Tahap</th></tr></thead><tbody>${supervision.map((s,i)=>`<tr><td><strong>${s[0]}</strong></td><td>${s[1]}</td><td>${s[2]}</td><td><span class="status ${i===2?'pending':''}">${s[3]}</span></td></tr>`).join('')}</tbody></table></div></div>`}
  function gtkPage(){return `${header('gtk',`<button class="btn btn-light" onclick="notify('Data GTK berhasil disiapkan untuk ekspor.')">⇩ Ekspor data</button>`)}<div class="grid stats"><div class="card stat"><div class="stat-top">Total GTK<span class="stat-icon">♙</span></div><div class="stat-value">29</div><div class="stat-foot">Guru dan tenaga kependidikan</div></div><div class="card stat"><div class="stat-top">Guru<span class="stat-icon">✎</span></div><div class="stat-value">24</div><div class="stat-foot">Guru aktif mengajar</div></div><div class="card stat"><div class="stat-top">PNS / PPPK<span class="stat-icon">✓</span></div><div class="stat-value">19</div><div class="stat-foot">ASN madrasah</div></div><div class="card stat"><div class="stat-top">Tenaga kependidikan<span class="stat-icon">⌂</span></div><div class="stat-value">5</div><div class="stat-foot">Staf pendukung</div></div></div><div class="card panel"><div class="toolbar"><div><strong style="font-size:13px">Direktori GTK</strong><div style="font-size:11px;color:var(--muted);margin-top:3px">Daftar guru dan tenaga kependidikan</div></div><div class="search"><span>⌕</span><input id="tableSearch" placeholder="Cari nama atau jabatan..." oninput="filterRows(this.value)"></div></div><div class="table-wrap"><table class="table" id="dataTable"><thead><tr><th>Nama</th><th>Jabatan / bidang</th><th>Status kepegawaian</th><th>Status</th></tr></thead><tbody>${staff.map(s=>`<tr data-search="${escapeHtml((s[0]+' '+s[1]+' '+s[2]).toLowerCase())}"><td><strong>${s[0]}</strong></td><td>${s[1]}</td><td>${s[2]}</td><td><span class="status">Aktif</span></td></tr>`).join('')}</tbody></table></div></div>`}
  function sarprasPage(){const items=[['Ruang kelas','12 ruang','Baik',100],['Perpustakaan','1 ruang','Perlu pemeliharaan',65],['Komputer laboratorium','24 unit','Baik',90],['Proyektor','8 unit','2 unit perlu perbaikan',70],['Toilet siswa','6 ruang','Baik',100]];return `${header('sarpras',`<button class="btn btn-light" onclick="notify('Data inventaris siap diekspor.')">⇩ Ekspor inventaris</button>`)}<div class="section-note">Pembaruan inventaris terakhir: 5 November 2025 · Periksa kondisi aset secara berkala.</div><div class="card panel"><div class="panel-head"><div><h2>Ringkasan inventaris</h2><p>Kondisi sarana dan prasarana madrasah</p></div><span class="tag">29 aset terdata</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Nama aset</th><th>Jumlah</th><th>Kondisi / catatan</th><th>Kelayakan</th></tr></thead><tbody>${items.map(i=>`<tr><td><strong>${i[0]}</strong></td><td>${i[1]}</td><td><span class="status ${i[2].includes('perlu')?'pending':''}">${i[2]}</span></td><td style="min-width:160px"><div style="display:flex;gap:9px;align-items:center"><div class="progress" style="flex:1"><span style="width:${i[3]}%"></span></div><small>${i[3]}%</small></div></td></tr>`).join('')}</tbody></table></div></div>`}
  function reportsPage(){return `${header('laporan',`<button class="btn btn-primary" onclick="window.print()">⇩ Cetak ringkasan</button>`)}<div class="section-note">Ringkasan administrasi MTs Harapan Bangsa · Tahun Pelajaran 2025/2026.</div><div class="grid stats"><div class="card stat"><div class="stat-top">Agenda tercatat<span class="stat-icon">▦</span></div><div class="stat-value">${agenda.length}</div><div class="stat-foot">Seluruh kegiatan madrasah</div></div><div class="card stat"><div class="stat-top">Persuratan<span class="stat-icon">✉</span></div><div class="stat-value">${letters.length}</div><div class="stat-foot">Surat masuk dan keluar</div></div><div class="card stat"><div class="stat-top">Program terlaksana<span class="stat-icon">◎</span></div><div class="stat-value">68<span style="font-size:16px">%</span></div><div class="stat-foot">Rencana kerja tahunan</div></div><div class="card stat"><div class="stat-top">GTK aktif<span class="stat-icon">♙</span></div><div class="stat-value">29</div><div class="stat-foot">Guru & tenaga kependidikan</div></div></div><div class="card panel"><div class="panel-head"><div><h2>Administrasi dan tindak lanjut</h2><p>Hal yang membutuhkan perhatian kepala madrasah</p></div></div><div class="agenda-list"><div class="agenda-item"><span class="stat-icon">✉</span><div class="agenda-info"><strong>${letters.filter(x=>x.status!=='Terkirim').length} surat menunggu tindak lanjut</strong><small>Periksa buku agenda persuratan</small></div><button class="text-link" onclick="navigate('surat')">Buka →</button></div><div class="agenda-item"><span class="stat-icon">▦</span><div class="agenda-info"><strong>${agenda.length} agenda kegiatan tercatat</strong><small>Pastikan persiapan kegiatan sesuai jadwal</small></div><button class="text-link" onclick="navigate('agenda')">Buka →</button></div><div class="agenda-item"><span class="stat-icon">⌕</span><div class="agenda-info"><strong>7 kegiatan supervisi terjadwal</strong><small>Semester ganjil tahun pelajaran 2025/2026</small></div><button class="text-link" onclick="navigate('supervisi')">Buka →</button></div></div></div>`}
  function render(key){activePage=key;document.getElementById('crumb').textContent=pageInfo[key][0];document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===key));const renderers={dashboard,agenda:agendaPage,surat:lettersPage,program:programPage,supervisi:supervisionPage,gtk:gtkPage,sarpras:sarprasPage,laporan:reportsPage};page.innerHTML=renderers[key]();if(key==='dashboard')bindTasks();document.getElementById('sidebar').classList.remove('open')}
  function navigate(key){render(key);window.scrollTo({top:0,behavior:'smooth'})}
  document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page)});
  document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
  document.getElementById('notification').addEventListener('click',()=>notify(`${letters.filter(x=>x.status!=='Terkirim').length} surat menunggu tindak lanjut.`));
  function bindTasks(){const checks=[...document.querySelectorAll('.todo-check')];checks.forEach(c=>c.addEventListener('change',()=>{const n=checks.filter(x=>x.checked).length;document.getElementById('taskProgress').textContent=`${n} / ${checks.length}`;document.getElementById('taskBar').style.width=`${n/checks.length*100}%`}))}
  function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function emptyRow(n,text){return `<tr><td colspan="${n}"><div class="empty">${text}</div></td></tr>`}
  function filterRows(query){document.querySelectorAll('#dataTable tbody tr[data-search]').forEach(row=>row.style.display=row.dataset.search.includes(query.toLowerCase())?'':'none')}
  function notify(message){const el=document.getElementById('notice');el.textContent=message;el.classList.add('show');clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>el.classList.remove('show'),2600)}
  const schemas={agenda:{title:'Tambah agenda',description:'Catat kegiatan dan jadwal madrasah.',fields:[['title','Nama kegiatan','text','Contoh: Rapat koordinasi'],['date','Tanggal','date',today.toISOString().slice(0,10)],['time','Waktu','time','08:00'],['place','Lokasi','text','Lokasi kegiatan'],['category','Kategori','select','Rapat|Kegiatan|Supervisi|Lainnya']]},surat:{title:'Catat surat',description:'Tambahkan surat masuk atau surat keluar ke buku agenda.',fields:[['number','Nomor surat','text','Nomor surat'],['subject','Perihal','text','Perihal surat'],['date','Tanggal surat','date',today.toISOString().slice(0,10)],['type','Jenis surat','select','Masuk|Keluar'],['status','Status','select','Konsep|Diproses|Terkirim']]}};
  let currentType='agenda';
  function openForm(type){currentType=type;const sc=schemas[type];document.getElementById('modalTitle').textContent=sc.title;document.getElementById('modalDescription').textContent=sc.description;document.getElementById('formFields').innerHTML=sc.fields.map(f=>`<div class="field ${f[0]==='subject'||f[0]==='title'?'full':''}"><label for="f-${f[0]}">${f[1]}</label>${f[2]==='select'?`<select id="f-${f[0]}" name="${f[0]}" required>${f[3].split('|').map(v=>`<option>${v}</option>`).join('')}</select>`:`<input id="f-${f[0]}" name="${f[0]}" type="${f[2]}" placeholder="${f[3]}" ${f[2]==='date'?'':'required'} value="${f[2]==='date'?f[3]:''}">`}</div>`).join('');document.getElementById('modalBackdrop').classList.add('show');setTimeout(()=>document.querySelector('#formFields input')?.focus(),50)}
  function closeForm(){document.getElementById('modalBackdrop').classList.remove('show')}
  document.getElementById('cancelModal').addEventListener('click',closeForm);document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeForm()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});
  document.getElementById('itemForm').addEventListener('submit',e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));obj.id=Date.now();if(currentType==='agenda'){agenda.push(obj);localStorage.setItem('rk-agenda',JSON.stringify(agenda))}else{letters.push(obj);localStorage.setItem('rk-letters',JSON.stringify(letters))}closeForm();render(activePage);notify(currentType==='agenda'?'Agenda berhasil ditambahkan.':'Surat berhasil dicatat.')});
  function removeItem(type,id){if(!confirm(type==='agenda'?'Hapus agenda ini?':'Hapus catatan surat ini?'))return;if(type==='agenda'){agenda=agenda.filter(x=>x.id!==id);localStorage.setItem('rk-agenda',JSON.stringify(agenda))}else{letters=letters.filter(x=>x.id!==id);localStorage.setItem('rk-letters',JSON.stringify(letters))}render(activePage);notify('Data berhasil dihapus.')}
  render('dashboard');
</script>
</body>
